<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBMCI One | Secure Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-deep: #06090f;
            --bg-card: rgba(12, 18, 30, 0.75);
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.06);
            --border-focus: rgba(212, 175, 55, 0.5);
            --text: #e8e6e3;
            --text-dim: rgba(255, 255, 255, 0.4);
            --text-label: rgba(255, 255, 255, 0.55);
            --gold: #1a6fb5;
            --gold-light: #5fb1bc;
            --gold-dark: #559dd4;
            --ember: #e8652e;
            --error: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-deep);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

    

        /* ====== NOISE TEXTURE ====== */
        .noise {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0.035;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 200px;
        }

        /* ====== INTRO SCREEN ====== */
        #intro {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: var(--bg-deep);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #intro.hide {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        .intro-line {
            width: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 24px 0;
            transition: width 1s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .intro-line.expand { width: min(400px, 80vw); }

        .intro-text {
            font-size: clamp(12px, 2vw, 14px);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--text-dim);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.6s ease;
        }
        .intro-text.show { opacity: 1; transform: translateY(0); }

        .intro-icon {
            width: 60px;
            height: 60px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.5) rotate(-90deg);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .intro-icon.show {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }
        .intro-icon svg { stroke: var(--gold); }

        /* ====== LOGIN CARD ====== */
        #loginWrap {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.9s cubic-bezier(0.23, 1, 0.32, 1);
        }
        #loginWrap.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(60px);
            -webkit-backdrop-filter: blur(60px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 48px 36px 36px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, var(--gold-dark) 30%, var(--gold-light) 50%, var(--gold-dark) 70%, transparent 100%);
            opacity: 0.6;
        }

        .card-glow {
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 200px;
            background: radial-gradient(ellipse, var(--gold) 0%, transparent 70%);
            opacity: 0.04;
            pointer-events: none;
        }

        /* ====== BRANDING ====== */
        .brand {
            text-align: center;
            margin-bottom: 36px;
        }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border: 1.5px solid rgba(61, 166, 231, 0.3);
            border-radius: 14px;
            margin-bottom: 20px;
            position: relative;
            background: rgba(73, 201, 233, 0.05);
        }

        .brand-mark span {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .brand h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .brand p {
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.5;
        }

        /* ====== FORM ====== */
        .field { margin-bottom: 20px; }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-label);
            margin-bottom: 10px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrap svg {
            position: absolute;
            left: 16px;
            width: 16px;
            height: 16px;
            stroke: var(--text-dim);
            transition: stroke 0.3s;
            pointer-events: none;
            z-index: 2;
        }

        .input-wrap input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 400;
            outline: none;
            transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .input-wrap input::placeholder { color: var(--text-dim); }

        .input-wrap input:focus {
            background: var(--surface-hover);
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.08), 0 0 20px rgba(212, 175, 55, 0.06);
        }

        .input-wrap:focus-within svg { stroke: var(--gold); }

        .toggle-pw {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: var(--text-dim);
            transition: color 0.3s;
            z-index: 2;
        }
        .toggle-pw:hover { color: var(--text); }
        .toggle-pw svg { position: static; pointer-events: auto; }

        /* ====== ERROR ====== */
        .error-box {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.15);
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #f87171;
            animation: slideDown 0.3s ease;
        }
        .error-box.show { display: flex; }
        .error-box svg { flex-shrink: 0; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ====== SUBMIT BTN ====== */
        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--bg-deep);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 40%, var(--gold-light) 100%);
            background-size: 200% 200%;
            animation: btnGradient 4s ease infinite;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.25), inset 0 1px 0 rgba(255,255,255,0.2);
            transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes btnGradient {
            0%,100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.35), inset 0 1px 0 rgba(255,255,255,0.3);
        }

        .submit-btn:active { transform: translateY(0); }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .submit-btn .shimmer {
            position: absolute;
            top: 0; left: -100%; bottom: 0;
            width: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.5s ease;
        }
        .submit-btn:hover .shimmer { left: 100%; }

        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            z-index: 1;
        }

        /* ====== FOOTER ====== */
        .footer {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 0.05em;
        }

        /* ====== SHAKE ====== */
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            10%,50% { transform: translateX(-8px); }
            30%,70% { transform: translateX(8px); }
            90% { transform: translateX(-3px); }
        }
        .shake { animation: shake 0.5s ease; }

        /* ====== SUCCESS ====== */
        @keyframes successPulse {
            0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
            70% { box-shadow: 0 0 0 15px rgba(34,197,94,0); }
            100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
        }
        .success-pulse { animation: successPulse 0.8s ease; }

        @keyframes cardFlyUp {
            to { opacity: 0; transform: translateY(-80px) scale(0.9); }
        }
        .fly-up { animation: cardFlyUp 0.7s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards; }

        /* ====== SUCCESS OVERLAY ====== */
        #successOverlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        #successOverlay.show { opacity: 1; }

        .success-ring {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--success);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(34,197,94,0.3);
            animation: popBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popBounce {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .success-ring svg {
            stroke: var(--success);
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: drawTick 0.4s ease forwards 0.3s;
        }

        @keyframes drawTick { to { stroke-dashoffset: 0; } }

        .success-text {
            margin-top: 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--success);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.4s ease forwards 0.5s;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ====== SPINNER ====== */
        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(6,9,15,0.2);
            border-top-color: var(--bg-deep);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 480px) {
            .card { padding: 36px 24px 28px; }
        }
    </style>
</head>
<body>


    <div class="noise"></div>

    <!-- INTRO -->
    <div id="intro">
        <div class="intro-icon" id="introIcon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
            </svg>
        </div>
        <div class="intro-line" id="introLine"></div>
        <div class="intro-text" id="introText">DBMCI One Dashboard</div>
    </div>

    <!-- SUCCESS OVERLAY -->
    <div id="successOverlay">
        <div class="success-ring">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        </div>
        <div class="success-text">Access Granted</div>
    </div>

    <!-- LOGIN CARD -->
    <div id="loginWrap">
        <div class="card" id="loginCard">
            <div class="card-glow"></div>

            <div class="brand">
                <div class="brand-mark">
    <img src="dbmci-one-logo.png" alt="DBMCI One" style="width:40px; height:40px; object-fit:contain;">
</div>                <h1 id="greeting">Welcome Back</h1>
                <p>Sign in to your DBMCI One workspace</p>
            </div>

            <form id="loginForm" autocomplete="off">
                <div class="field">
                    <label>Email</label>
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"/>
                            <path d="M22 4L12 13 2 4"/>
                        </svg>
                        <input type="email" id="email" placeholder="you@dbmci.one" required>
                    </div>
                </div>

                <div class="field">
                    <label>Password</label>
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4"/>
                        </svg>
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" class="toggle-pw" id="togglePw">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" id="eyeSvg">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="error-box" id="errorBox">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <span id="errorText"></span>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="shimmer"></span>
                    <span class="btn-content" id="btnContent">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
                        </svg>
                        Sign In
                    </span>
                </button>
            </form>

            <div class="footer">© DBMCI One ·</div>
        </div>
    </div>

    <script>
      

        // ====== INTRO SEQUENCE ======
        (function() {
            const icon = document.getElementById('introIcon');
            const line = document.getElementById('introLine');
            const text = document.getElementById('introText');
            const intro = document.getElementById('intro');
            const wrap = document.getElementById('loginWrap');

            setTimeout(() => icon.classList.add('show'), 300);
            setTimeout(() => line.classList.add('expand'), 900);
            setTimeout(() => text.classList.add('show'), 1400);
            setTimeout(() => intro.classList.add('hide'), 2800);
            setTimeout(() => {
                wrap.classList.add('visible');
                document.getElementById('email').focus();
            }, 3400);
        })();

        // ====== GREETING ======
        (function() {
            const h = new Date().getHours();
            let g = 'Welcome Back';
            if (h >= 5 && h < 12) g = 'Good Morning';
            else if (h >= 12 && h < 17) g = 'Good Afternoon';
            else if (h >= 17 && h < 21) g = 'Good Evening';
            document.getElementById('greeting').textContent = g;
        })();

        // ====== AUTH LOGIC ======
        const authorizedUsers = [
            { email: "daniel.paul@marrowmed.com", password: "Daniel@99" },
            { email: "vikas.singh@dbmci.one", password: "singh" },
            { email: "abhishek.sharma@dbmi.edu.in", password: "Abhishek@77" },
            { email: "admin@dbmci.one", password: "dbmci@2025" },
            { email: "moderator@dbmci.one", password: "dbmci@2025" },
            { email: "lithisha.s@dbmci.one", password: "dbmci@2025" },
            { email: "karthik.n@dbmci.one", password: "dbmci@2025" },
            { email: "bhavna.singh@dbmi.edu.in", password: "dbmci@2025" },
            { email: "dharmik@marrowmed.com", password: "Dharmik@123" },
            { email: "vineet@marrowmed.com", password: "Vineetb@88" },
            { email: "faculty@dbmci.one", password: "dbmci@2025" }
        ];

        const form = document.getElementById('loginForm');
        const emailEl = document.getElementById('email');
        const passEl = document.getElementById('password');
        const togglePw = document.getElementById('togglePw');
        const eyeSvg = document.getElementById('eyeSvg');
        const errorBox = document.getElementById('errorBox');
        const errorText = document.getElementById('errorText');
        const submitBtn = document.getElementById('submitBtn');
        const btnContent = document.getElementById('btnContent');
        const card = document.getElementById('loginCard');
        const successOverlay = document.getElementById('successOverlay');
        let pwVisible = false;

        togglePw.addEventListener('click', () => {
            pwVisible = !pwVisible;
            passEl.type = pwVisible ? 'text' : 'password';
            eyeSvg.innerHTML = pwVisible
                ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
                : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const email = emailEl.value.trim();
            const password = passEl.value;

            const user = authorizedUsers.find(u => u.email === email && u.password === password);

            if (user) {
                errorBox.classList.remove('show');
                submitBtn.disabled = true;
                btnContent.innerHTML = '<div class="spinner"></div> Verifying...';

                setTimeout(() => {
                    btnContent.innerHTML = '✓ Authenticated';
                    card.classList.add('success-pulse');

                    setTimeout(() => {
                        successOverlay.classList.add('show');
                        setTimeout(() => {
                            card.parentElement.classList.add('fly-up');
                            setTimeout(() => {
                                sessionStorage.setItem('dbmciAuth', 'true');
                                sessionStorage.setItem('userEmail', email);
                                window.location.href = 'index.html';
                            }, 700);
                        }, 600);
                    }, 500);
                }, 1200);
            } else {
                errorText.textContent = 'Invalid email or password. Please try again.';
                errorBox.classList.add('show');
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 500);
            }
        });
    </script>
</body>
</html>
